packages:
  - 'apps/dsh-desktop'

autoInstallPeers: false
minimumReleaseAge: 720
supportedArchitectures:
  os:
    - current
    - darwin
  cpu:
    - current
    - x64
    - arm64
overrides:
  ws: 8.21.3
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  cloudflared: true
  cpu-features: true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true

patchedDependencies:
  '@deepseek-ai/dsh-sandbox-windows-acl@0.1.1-rc.2': patches/@deepseek-ai__dsh-sandbox-windows-acl@0.1.1-rc.2.patch
  '@deepseek-ai/dsh-subprocess-local@0.1.1-rc.2': patches/@deepseek-ai__dsh-subprocess-local@0.1.1-rc.2.patch
  '@deepseek-ai/dsh-web-app@0.1.1-rc.2': patches/@deepseek-ai__dsh-web-app@0.1.1-rc.2.patch
  '@deepseek-ai/dsh@0.1.1-rc.2': patches/@deepseek-ai__dsh@0.1.1-rc.2.patch
