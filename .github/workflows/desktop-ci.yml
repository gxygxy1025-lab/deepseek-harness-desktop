name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @deepseek-ai/dsh-desktop test:runtime-provider:e2e
      - run: pnpm --filter @deepseek-ai/dsh-desktop pack:dir
      - name: Verify packaged directory picker and update shutdown
        shell: pwsh
        run: |
          $env:DSH_DESKTOP_E2E_EXECUTABLE = (Resolve-Path 'apps/dsh-desktop/dist/win-unpacked/DeepSeek Harness Desktop.exe').Path
          pnpm --filter @deepseek-ai/dsh-desktop test:directory-picker:e2e
          pnpm --filter @deepseek-ai/dsh-desktop test:update-shutdown:e2e
      - run: git diff --check
