name: Desktop Release

on:
  push:
    tags:
      - desktop-v*

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deepseek-ai/dsh-desktop exec playwright install chromium
      - run: pnpm verify
      - run: pnpm --filter @deepseek-ai/dsh-desktop test:runtime-provider:e2e
      - name: Configure optional anonymous product metrics
        shell: pwsh
        env:
          DSH_TELEMETRY_ENDPOINT: ${{ vars.DSH_TELEMETRY_ENDPOINT }}
        run: |
          $endpointText = [string]$env:DSH_TELEMETRY_ENDPOINT
          if ([string]::IsNullOrWhiteSpace($endpointText)) {
            Set-Content -LiteralPath 'apps/dsh-desktop/build/telemetry-config.json' -Value '{"endpoint":""}' -Encoding utf8NoBOM
            Write-Output 'DSH_TELEMETRY_ENDPOINT is not configured; product metrics remain disabled.'
            exit 0
          }
          try {
            $endpoint = [System.Uri]::new($endpointText.Trim(), [System.UriKind]::Absolute)
          } catch {
            throw 'DSH_TELEMETRY_ENDPOINT must be an absolute HTTPS URL.'
          }
          if ($endpoint.Scheme -ne 'https' -or
              [string]::IsNullOrWhiteSpace($endpoint.Host) -or
              $endpoint.AbsolutePath -ne '/v1/events' -or
              $endpoint.Query -ne '' -or
              $endpoint.Fragment -ne '' -or
              $endpoint.UserInfo -ne '') {
            throw 'DSH_TELEMETRY_ENDPOINT must be a credential-free HTTPS URL ending exactly in /v1/events.'
          }
          $configuration = [ordered]@{ endpoint = $endpoint.AbsoluteUri } | ConvertTo-Json -Compress
          Set-Content -LiteralPath 'apps/dsh-desktop/build/telemetry-config.json' -Value $configuration -Encoding utf8NoBOM
      - run: pnpm desktop:pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged directory picker
        shell: pwsh
        run: |
          $env:DSH_DESKTOP_E2E_EXECUTABLE = (Resolve-Path 'apps/dsh-desktop/dist/win-unpacked/DeepSeek Harness Desktop.exe').Path
          pnpm --filter @deepseek-ai/dsh-desktop test:directory-picker:e2e
      - name: Verify packaged update shutdown receipt
        shell: pwsh
        run: |
          $env:DSH_DESKTOP_E2E_EXECUTABLE = (Resolve-Path 'apps/dsh-desktop/dist/win-unpacked/DeepSeek Harness Desktop.exe').Path
          pnpm --filter @deepseek-ai/dsh-desktop test:update-shutdown:e2e
      - run: pnpm --filter @deepseek-ai/dsh-desktop pack:verify
      - run: pnpm --filter @deepseek-ai/dsh-desktop pack:smoke
      - name: Write checksums
        shell: pwsh
        run: |
          $installer = Get-Item apps/dsh-desktop/dist/DeepSeek-Harness-Desktop-Setup-*.exe
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii apps/dsh-desktop/dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/launch/release-notes.md
          overwrite_files: false
          files: |
            apps/dsh-desktop/dist/DeepSeek-Harness-Desktop-Setup-*.exe
            apps/dsh-desktop/dist/DeepSeek-Harness-Desktop-Setup-*.exe.blockmap
            apps/dsh-desktop/dist/latest.yml
            apps/dsh-desktop/dist/SHA256SUMS.txt
