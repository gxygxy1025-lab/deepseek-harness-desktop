name: Desktop macOS Candidate

on:
  push:
    branches:
      - release/macos-*
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-macos-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-test:
    name: Native ${{ matrix.arch }} validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            app-directory: mac-arm64
          - runner: macos-15-intel
            arch: x64
            app-directory: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm verify
      - run: pnpm --filter @deepseek-ai/dsh-desktop test:runtime-provider:e2e
      - name: Build native directory package
        run: pnpm --filter @deepseek-ai/dsh-desktop exec electron-builder --mac dir --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify native directory package
        run: >-
          pnpm --filter @deepseek-ai/dsh-desktop run pack:verify:mac --
          --allow-missing-artifacts
          --arch=${{ matrix.arch }}
          "${{ github.workspace }}/apps/dsh-desktop/dist/${{ matrix.app-directory }}/DeepSeek Harness Desktop.app"
      - name: Smoke test native directory package
        run: >-
          pnpm --filter @deepseek-ai/dsh-desktop run pack:smoke --
          "${{ github.workspace }}/apps/dsh-desktop/dist/${{ matrix.app-directory }}/DeepSeek Harness Desktop.app/Contents/MacOS/DeepSeek Harness Desktop"

  mac-package-candidate:
    name: Unsigned ${{ matrix.arch }} candidate
    needs: native-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            app-directory: mac-arm64
          - runner: macos-15-intel
            arch: x64
            app-directory: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build unsigned architecture-specific DMG and ZIP
        run: pnpm --filter @deepseek-ai/dsh-desktop run pack:mac:${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm --filter @deepseek-ai/dsh-desktop run pack:verify:mac -- --arch=${{ matrix.arch }}
      - name: Smoke test architecture-specific package
        run: >-
          pnpm --filter @deepseek-ai/dsh-desktop run pack:smoke --
          "${{ github.workspace }}/apps/dsh-desktop/dist/${{ matrix.app-directory }}/DeepSeek Harness Desktop.app/Contents/MacOS/DeepSeek Harness Desktop"
      - name: Rename architecture-specific update metadata
        working-directory: apps/dsh-desktop/dist
        run: mv latest-mac.yml latest-mac-${{ matrix.arch }}.yml
      - name: Write candidate checksums
        working-directory: apps/dsh-desktop/dist
        run: shasum -a 256 DeepSeek-Harness-Desktop-*-${{ matrix.arch }}.dmg DeepSeek-Harness-Desktop-*-${{ matrix.arch }}.zip > SHA256SUMS-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeepSeek-Harness-Desktop-${{ github.run_id }}-macOS-${{ matrix.arch }}-unsigned-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/dsh-desktop/dist/DeepSeek-Harness-Desktop-*-${{ matrix.arch }}.dmg
            apps/dsh-desktop/dist/DeepSeek-Harness-Desktop-*-${{ matrix.arch }}.zip
            apps/dsh-desktop/dist/latest-mac-${{ matrix.arch }}.yml
            apps/dsh-desktop/dist/SHA256SUMS-${{ matrix.arch }}.txt

  mac-update-metadata-candidate:
    name: Merge macOS update metadata
    needs: mac-package-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: DeepSeek-Harness-Desktop-${{ github.run_id }}-macOS-*-unsigned-candidate
          path: candidate-assets
          merge-multiple: true
      - name: Merge architecture-specific update metadata
        run: >-
          node apps/dsh-desktop/scripts/merge-mac-update-metadata.mjs
          --x64=candidate-assets/latest-mac-x64.yml
          --arm64=candidate-assets/latest-mac-arm64.yml
          --output=candidate-assets/latest-mac.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeepSeek-Harness-Desktop-${{ github.run_id }}-macOS-split-unsigned-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            candidate-assets/DeepSeek-Harness-Desktop-*.dmg
            candidate-assets/DeepSeek-Harness-Desktop-*.zip
            candidate-assets/latest-mac.yml
            candidate-assets/latest-mac-*.yml
            candidate-assets/SHA256SUMS-*.txt
