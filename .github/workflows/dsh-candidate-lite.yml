name: DSH Candidate Lite

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: Exact candidate @deepseek-ai/dsh version
        required: true
        type: string
      compatibility_issue:
        description: Optional existing compatibility issue number to update on failure
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: dsh-candidate-lite-${{ inputs.dsh_version }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate exact candidate input
        env:
          DSH_CANDIDATE_VERSION: ${{ inputs.dsh_version }}
        run: node -e "import('./scripts/prepare-dsh-candidate.mjs').then((m) => console.log(m.validateCandidateVersion(process.env.DSH_CANDIDATE_VERSION)))"

      - name: Snapshot stable inputs and create detached worktree
        id: isolate
        shell: pwsh
        run: |
          $candidateRoot = Join-Path $env:RUNNER_TEMP 'dsh-candidate-worktree'
          $trackedInputs = @(
            'package.json',
            'apps/dsh-desktop/package.json',
            'pnpm-lock.yaml',
            'docs/launch/release-notes.md',
            'apps/dsh-desktop/electron-builder.yml'
          )
          $hashes = [ordered]@{}
          foreach ($path in $trackedInputs) {
            $hashes[$path] = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $hashes | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'stable-before.json') -Encoding utf8
          Copy-Item -LiteralPath 'apps/dsh-desktop/runtime-support/known-good.json' -Destination (Join-Path $env:RUNNER_TEMP 'stable-evidence.json')
          git worktree add --detach $candidateRoot HEAD
          "candidate_root=$candidateRoot" >> $env:GITHUB_OUTPUT

      - name: Install exact candidate and exact peers
        id: prepare
        continue-on-error: true
        working-directory: ${{ steps.isolate.outputs.candidate_root }}
        env:
          DSH_CANDIDATE_VERSION: ${{ inputs.dsh_version }}
        run: |
          pnpm install --frozen-lockfile
          node scripts/prepare-dsh-candidate.mjs --version $env:DSH_CANDIDATE_VERSION

      - name: Typecheck and unit suites
        id: unit
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ steps.isolate.outputs.candidate_root }}
        run: |
          pnpm typecheck
          pnpm test
          pnpm test:scripts
          pnpm runtime-deps:check
          pnpm sync-shared:check
          pnpm aggregate:check
          pnpm docs:check

      - name: Verify provider startup stop recover and profile creation
        id: runtime
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ steps.isolate.outputs.candidate_root }}
        env:
          DSH_CANDIDATE_VERSION: ${{ inputs.dsh_version }}
        run: pnpm --filter @deepseek-ai/dsh-desktop test:runtime-provider:e2e

      - name: Verify Desktop Contract built-ins Task Board and directory picker
        id: desktop_e2e
        if: steps.unit.outcome == 'success' && steps.runtime.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ steps.isolate.outputs.candidate_root }}
        run: |
          pnpm --filter @deepseek-ai/dsh-desktop exec playwright install chromium
          pnpm --filter @deepseek-ai/dsh-desktop test:directory-picker:e2e

      - name: Package verify and smoke candidate
        id: package
        if: steps.desktop_e2e.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ steps.isolate.outputs.candidate_root }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm desktop:pack
          pnpm --filter @deepseek-ai/dsh-desktop pack:verify
          pnpm --filter @deepseek-ai/dsh-desktop pack:smoke

      - name: Collect candidate evidence and stable hash guard
        id: evidence
        if: always()
        shell: pwsh
        env:
          CANDIDATE_ROOT: ${{ steps.isolate.outputs.candidate_root }}
          CANDIDATE_VERSION: ${{ inputs.dsh_version }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          DESKTOP_E2E_OUTCOME: ${{ steps.desktop_e2e.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        run: |
          function Convert-Outcome([string]$outcome) {
            if ($outcome -eq 'success') { return 'passed' }
            if ($outcome -eq 'failure') { return 'failed' }
            return 'skipped'
          }
          $trackedInputs = @(
            'package.json',
            'apps/dsh-desktop/package.json',
            'pnpm-lock.yaml',
            'docs/launch/release-notes.md',
            'apps/dsh-desktop/electron-builder.yml'
          )
          $after = [ordered]@{}
          foreach ($path in $trackedInputs) {
            $after[$path] = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $after | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'stable-after.json') -Encoding utf8
          $candidateEvidencePath = Join-Path $env:RUNNER_TEMP 'candidate-evidence.json'
          if (Test-Path -LiteralPath (Join-Path $env:CANDIDATE_ROOT 'apps/dsh-desktop/node_modules/@deepseek-ai/dsh/package.json')) {
            Push-Location $env:CANDIDATE_ROOT
            node scripts/generate-runtime-support.mjs --stdout | Set-Content -LiteralPath $candidateEvidencePath -Encoding utf8
            Pop-Location
          } else {
            '{}' | Set-Content -LiteralPath $candidateEvidencePath -Encoding utf8
          }
          $input = [ordered]@{
            candidateVersion = $env:CANDIDATE_VERSION
            stableEvidence = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'stable-evidence.json') -Raw | ConvertFrom-Json
            candidateEvidence = Get-Content -LiteralPath $candidateEvidencePath -Raw | ConvertFrom-Json
            stableHashesBefore = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'stable-before.json') -Raw | ConvertFrom-Json
            stableHashesAfter = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'stable-after.json') -Raw | ConvertFrom-Json
            checks = @(
              @{ id = 'candidate-install-exact-peers'; status = Convert-Outcome $env:PREPARE_OUTCOME },
              @{ id = 'typecheck-unit-contract-builtins-task-board'; status = Convert-Outcome $env:UNIT_OUTCOME },
              @{ id = 'runtime-start-stop-recover-profile'; status = Convert-Outcome $env:RUNTIME_OUTCOME },
              @{ id = 'directory-picker-e2e'; status = Convert-Outcome $env:DESKTOP_E2E_OUTCOME },
              @{ id = 'pack-verify-smoke'; status = Convert-Outcome $env:PACKAGE_OUTCOME },
              @{ id = 'report-generated'; status = 'passed' }
            )
          }
          $input | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'candidate-report-input.json') -Encoding utf8

      - name: Generate Markdown and JSON compatibility reports
        id: report
        if: always()
        continue-on-error: true
        run: node scripts/dsh-candidate-report.mjs --input "$env:RUNNER_TEMP/candidate-report-input.json" --json "$env:RUNNER_TEMP/dsh-candidate-report.json" --markdown "$env:RUNNER_TEMP/dsh-candidate-report.md"

      - name: Upload Candidate Lite reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-candidate-${{ inputs.dsh_version }}
          path: |
            ${{ runner.temp }}/dsh-candidate-report.json
            ${{ runner.temp }}/dsh-candidate-report.md

      - name: Update compatibility issue on failure
        if: always() && steps.report.outcome == 'failure' && inputs.compatibility_issue != ''
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ inputs.compatibility_issue }}
          CANDIDATE_VERSION: ${{ inputs.dsh_version }}
        with:
          script: |
            const issueNumber = Number.parseInt(process.env.ISSUE_NUMBER, 10)
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) core.setFailed('invalid compatibility issue number')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `Candidate Lite failed for exact DSH ${process.env.CANDIDATE_VERSION}. See workflow artifact ${context.runId}.`,
            })

      - name: Enforce candidate result without mutating Stable
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.report.outcome }}' -ne 'success') { throw 'Candidate Lite compatibility report failed' }
