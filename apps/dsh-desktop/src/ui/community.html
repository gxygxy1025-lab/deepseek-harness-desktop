<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>加入社群</title>
    <link rel="stylesheet" href="./harness-base.css">
    <link rel="stylesheet" href="./community.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">DeepSeek Harness Desktop</p>
        <h1>加入社群</h1>
        <p class="intro">通过官方加群页面联系其他用户，也可以直接反馈问题。</p>
      </header>

      <section class="community-card" aria-labelledby="qq-group-heading">
        <div class="group-heading">
          <span class="qq-mark" aria-hidden="true">QQ</span>
          <div>
            <p class="label">官方社群</p>
            <h2 id="qq-group-heading">DeepSeek Harness Desktop 用户群</h2>
          </div>
        </div>
        <p class="join-hint">点击下方按钮，在当前电脑打开官方加群页面。</p>
        <a class="action primary" id="join-community" target="_blank" rel="noreferrer">一键加群</a>
      </section>

      <section class="feedback-card" aria-labelledby="feedback-heading">
        <div>
          <p class="label">反馈与建议</p>
          <h2 id="feedback-heading">有想法或遇到问题？</h2>
          <p>前往 GitHub 提交建议，便于跟踪处理进度与版本修复。</p>
        </div>
        <a class="action secondary" id="open-feedback" target="_blank" rel="noreferrer">前往 GitHub</a>
      </section>
    </main>
    <script type="module" src="./community.mjs"></script>
  </body>
</html>
