appId: ai.deepseek.harness.desktop
productName: DeepSeek Harness Desktop
copyright: Copyright (c) 2026 DeepSeek Harness Desktop contributors

asar: true
asarUnpack:
  - node_modules/**
compression: normal
electronLanguages:
  - en-US
  - zh-CN
afterPack: scripts/after-pack.cjs

extraResources:
  - from: build/icon.png
    to: app-icon.png

directories:
  output: dist
  buildResources: build

files:
  - src/**
  - package.json
  - '!**/*.map'
  - '!**/test/**'

win:
  icon: build/icon.ico
  extraResources:
    - from: build/update-shutdown-v1
      to: update-shutdown-v1
    - from: build/update-shutdown-v2
      to: update-shutdown-v2
    - from: build/installer-upgrade-v3
      to: installer-upgrade-v3
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker

mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  minimumSystemVersion: '13.0'
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  x64ArchFiles: '**/{*-darwin-*,darwin-*}/**'
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  artifactName: DeepSeek-Harness-Desktop-${version}-${arch}.${ext}

dmg:
  title: DeepSeek Harness Desktop ${version}
  artifactName: DeepSeek-Harness-Desktop-${version}-${arch}.${ext}

nsis:
  include: build/installer.nsh
  artifactName: DeepSeek-Harness-Desktop-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness Desktop

publish:
  provider: github
  owner: gxygxy1025-lab
  repo: deepseek-harness-desktop

protocols:
  - name: DeepSeek Harness Desktop
    schemes:
      - dsh
